services:
  - type: web
    name: spotlight-backend
    env: node
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GODADDY_UPLOAD_URL
        sync: false
      - key: UPLOAD_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: CAMPUS_TIME_ZONE
        value: Asia/Kolkata
      - key: ADMIN_EMAIL
        value: spotlightapp.help@gmail.com
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        value: spotlightapp.help@gmail.com
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLUB_LOGIN_URL
        sync: false
