<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var noop = function() {};
        window.console.warn = noop;
        window.console.log = noop;
        window.console.info = noop;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <title>Spotlight-RIT | Ramaiah Institute of Technology</title>

    <!-- Preconnect to server origins proactively for faster font & asset loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('spotlight_theme');
          var theme = saved || 'dark';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
      }
      /* Page colour before the app's CSS arrives, so moving between the student,
         club and admin apps (full page loads) never flashes white */
      html.dark { background: #0e0e10; }
      html.light { background: #f7f7f8; }
      #root {
        min-height: 100%;
      }
      /* Each app fades in when it mounts. Opacity only: a transform would break position: fixed inside */
      #root > * { animation: page-in 0.35s ease both; }
      @keyframes page-in { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #root > * { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
